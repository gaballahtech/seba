name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Lint package publishing/exports
        run: npx --yes publint@0.3.12
      - name: Audit production dependencies (required)
        run: npm audit --omit=dev --audit-level=high
      - name: Check exports/types (attw, best-effort)
        continue-on-error: true
        run: npm run build && npx --yes @arethetypeswrong/cli@0.18.2 --pack . --ignore-rules cjs-resolves-to-esm
      - name: Coverage (required thresholds)
        run: npm run test:coverage
      - name: Coverage summary (PR comment)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Coverage\nCoverage job completed. See the `Coverage (required thresholds)` step for details and `docs/coverage-baseline.md` for the baseline/target.';
            try { if (fs.existsSync('coverage/lcov.info')) body += '\n\n`coverage/lcov.info` was generated.'; } catch {}
            github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body });
      - name: Bundle size (T11)
        run: npm run build && npm run size

