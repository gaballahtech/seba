name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Lint package publishing/exports
        run: npx --yes publint@0.3.12
      - name: Check exports/types (attw, best-effort)
        continue-on-error: true
        run: npm run build && npx --yes @arethetypeswrong/cli@0.18.2 --pack . --ignore-rules cjs-resolves-to-esm
      - name: Coverage (informational)
        continue-on-error: true
        run: npm run test:coverage
