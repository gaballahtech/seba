name: E2E

on:
  pull_request:
    paths:
      - "src/core/**"
      - "src/node/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          # Optional: set repository secrets to enable live Target A (solidweb.org).
          SEBA_E2E_SOLIDWEB: ${{ secrets.SEBA_E2E_SOLIDWEB }}
          SEBA_E2E_SOLIDWEB_WEBID: ${{ secrets.SEBA_E2E_SOLIDWEB_WEBID }}
