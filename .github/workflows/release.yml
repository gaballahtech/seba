name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish to npm (idempotent)
        env:
          # Supports either an npm automation token (NPM_TOKEN, scoped to npm-publish env or repo)
          # or npm Trusted Publishing (OIDC) configured on npmjs.com for this repo/workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION_TAG#v}"
          if npm view "@gaballahtech/seba@$VERSION" version >/dev/null 2>&1; then
            echo "@gaballahtech/seba@$VERSION is already published on npm; skipping publish."
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN not set; attempting publish via npm Trusted Publishing (OIDC) if configured."
            # setup-node writes an .npmrc auth token placeholder; remove it so npm can use OIDC.
            unset NODE_AUTH_TOKEN
            npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
            if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
              sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG" || true
            fi
            if [ -f "$HOME/.npmrc" ]; then
              sed -i '/_authToken/d' "$HOME/.npmrc" || true
            fi
          fi
          npm publish --provenance --access public
