name: Bug report
description: Something in SEBA does not behave as documented.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** include access tokens, refresh tokens,
        authorization codes, private keys or full provider responses here — redact them.
        Security vulnerabilities go to [SECURITY.md](https://github.com/gaballahtech/seba/blob/main/SECURITY.md), not to this form.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "@gaballahtech/seba 0.5.0"
    validations:
      required: true
  - type: dropdown
    id: entry-point
    attributes:
      label: Entry point
      options:
        - "@gaballahtech/seba (Seba)"
        - "<seba-login> custom element"
        - "@gaballahtech/seba/react"
        - "seba client-id CLI"
        - "Seba.pod helpers"
        - "Other / not sure"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime
      description: Browser and version, Node.js version, or bundler.
      placeholder: "Chrome 141 / Node 22.11 / Vite 8"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the error name/code (`SebaNetworkError`, `error.stage`, …) and a redacted stack trace.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A repository, CodeSandbox, or the smallest snippet that shows the problem.
      render: ts
    validations:
      required: true
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and the CHANGELOG for this behaviour.
          required: true
        - label: I removed tokens, codes, keys and personal data from this report.
          required: true
